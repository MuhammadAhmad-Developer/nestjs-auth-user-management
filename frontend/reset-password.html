<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
</head>
<body>

<h2>Reset Password</h2>

<input type="password" id="password" placeholder="New Password" /><br><br>
<input type="password" id="confirmPassword" placeholder="Confirm Password" /><br><br>

<button onclick="resetPassword()">Reset Password</button>

<p id="message"></p>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const sid = urlParams.get('sid');

  async function resetPassword() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    //  check SID instead of token
    if (!sid) {
      document.getElementById('message').innerText = "SID missing!";
      return;
    }

    //  Password match check
    if (password !== confirmPassword) {
      document.getElementById('message').innerText = "Passwords do not match";
      return;
    }

    try {
      const response = await fetch('http://127.0.0.1:3000/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

        //   correct field name
        body: JSON.stringify({
     sid: sid,
       newPassword: password   // CORRECT
           })
      });

      const data = await response.json();

      console.log("Response:", data);

      if (response.ok) {
        document.getElementById('message').innerText = "Password reset successful ";
      } else {
        document.getElementById('message').innerText = data.message || "Reset failed ";
      }

    } catch (error) {
      console.error("FULL ERROR:", error);
      document.getElementById('message').innerText = "Error resetting password";
    }
  }
</script>

</body>
</html>
